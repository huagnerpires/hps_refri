name: Deploy Flutter Web

on:
  push:
    branches:
      - flutterflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Corrige flutter_flow_drop_down
        run: sed -i 's/initialValue: currentValue,/value: currentValue,/' lib/flutter_flow/flutter_flow_drop_down.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release --base-href /hps_refri/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
